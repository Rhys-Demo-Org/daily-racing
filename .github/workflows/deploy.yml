# Builds the game and deploys it to Cloudflare Pages: pushes to main go live, PRs from this repo get
# a preview at <branch>.daily-racing.pages.dev. PRs from forks build but never see the secrets.
# Two jobs on purpose: `build` runs branch code (tests, build) with no secrets; `deploy` has the
# Cloudflare token but never checks out or runs branch code, it only uploads the built files.
# Owner-maintained (protected path). Actions are pinned by commit; versions match the container.
name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Install (frozen, no scripts)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Static files only (branch code wrote dist; no Pages Functions, workers or routing files)
        run: |
          bad=$(find dist \( -name _worker.js -o -name _routes.json -o -name _redirects -o -name _headers -o -path dist/functions \) -print)
          if [ -n "$bad" ]; then echo "refusing to deploy: $bad"; exit 1; fi
      - name: Preview branch name (sanitised; branch names are never interpolated raw)
        id: branch
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          preCommands: npx wrangler pages project create daily-racing --production-branch main || true
          command: pages deploy dist --project-name daily-racing --branch ${{ steps.branch.outputs.name }}
