# Builds the game and deploys it to Cloudflare Pages: pushes to main go live, PRs from this repo get
# a preview at <branch>.daily-racing.pages.dev. PRs from forks build but never see the secrets.
# Owner-maintained (protected path). Actions are pinned by commit; versions match the container.
name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Install (frozen, no scripts)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Preview branch name (sanitised; branch names are never interpolated raw)
        id: branch
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          preCommands: npx wrangler pages project create daily-racing --production-branch main || true
          command: pages deploy dist --project-name daily-racing --branch ${{ steps.branch.outputs.name }}
